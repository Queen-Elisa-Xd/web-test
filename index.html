<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musicfy</title>
<meta name="theme-color" content="#1A1410">

<!-- ---- PWA / "Add to Home Screen" support ---- -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Musicfy">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
<style>
  @font-face{
    font-family: 'AMS Deepak';
    src: url('AMS_Deepak.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  @font-face{
    font-family: 'Old London';
    src: url('OldLondon.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  :root{
    --cream: #F5EFE4;
    --muted: rgba(245,239,228,0.68);
    --faint: rgba(245,239,228,0.42);
    --glass-border: rgba(255,255,255,0.28);
    --accent: #E8C468;
    --green: #3DDC84;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  /* ---- Butterfly overlay video: blends onto bg.jpg, sits behind the
         player card / name / captions / menu (all have z-index >= 1),
         so it never covers them. Hidden by default — only shown while a
         song is actually playing. ---- */
  /* ---- Background photo: a real <img>, sized/positioned EXACTLY like the
         butterfly video and boy cutout below (fixed, 100vw x 100vh,
         object-fit:cover, object-position:center) — using the same technique
         for all three guarantees they line up pixel-for-pixel on every
         device, instead of relying on CSS background-attachment:fixed
         (which behaves inconsistently on mobile browsers). No dark overlay —
         shows bg.jpg in its original, unfaded colors at all times. ---- */
  .bg-photo{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    z-index: -1;
    pointer-events: none;
  }

  .butterfly-overlay{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    z-index: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.7s ease;
  }

  /* ---- Boy cutout PNG: sits above the butterfly video (so butterflies
         appear to fly behind him) and below the player card / name /
         captions / menu (so it never covers the UI). Same cover-crop
         behaviour as bg.jpg so it lines up on every screen size. ---- */
  .boy-cutout{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    object-position: center;
    z-index: 1;
    /* Clicks on boy (left/right) drive ±5s seek; player card / menu sit
       above this layer so they still receive their own taps. */
    pointer-events: auto;
    touch-action: manipulation;
  }
  .butterfly-overlay.show{
    opacity: 1;
  }

  body{
    background: #1A1410;
    color: var(--cream);
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  /* ---- Center: Hindi name in AMS Deepak font ---- */
  .center-name{
    font-family: 'AMS Deepak', 'Yatra One', cursive;
    font-size: clamp(15px, 4vw, 24px);
    color: #FF7A1A;
    text-shadow: 0 4px 20px rgba(0,0,0,0.6), 0 2px 6px rgba(0,0,0,0.4);
    pointer-events: none;
    text-align: center;
    line-height: 1;
  }

  /* ---- Rotating captions, between name and player card ---- */
  .caption-strip{
    width: min(240px, 78vw);
    text-align: center;
    color: #FF1A1A;
    font-family: 'Old London', Georgia, 'Times New Roman', serif;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0.4px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    white-space: pre-line;
  }
  .caption-strip.show{
    opacity: 1;
    transform: translateY(0);
  }

  /* ---- Top-left: date/time ---- */
  .top-left-time{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    font-size: 11.5px;
    color: var(--faint);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }

  /* ---- Top-center: live dot + online count ---- */
  .live-badge{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    display:flex;
    align-items:center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    white-space: nowrap;
    z-index: 2;
  }
  .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px 1px rgba(61,220,132,0.7);
    flex-shrink: 0;
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  @keyframes pulse-dot{
    0%, 100%{ opacity:1; transform: scale(1); }
    50%{ opacity:0.55; transform: scale(0.85); }
  }

  /* ---- Top-right: playlist chooser (three-dot menu) ---- */
  .menu-wrap{
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    z-index: 5;
  }
  .menu-btn{
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: background 0.15s;
  }
  .menu-btn:hover{ background: rgba(255,255,255,0.18); }
  .menu-btn svg{ width: 16px; height: 16px; }

  .menu-dropdown{
    position: absolute;
    top: 40px;
    right: 0;
    width: min(230px, 82vw);
    max-width: min(230px, 82vw);
    box-sizing: border-box;
    background: rgba(25,18,10,0.88);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 6px;
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 16px 40px -14px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    gap: 2px;
    max-height: min(60vh, 340px);
    overflow-y: auto;
    overflow-x: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px) scale(0.96);
    transform-origin: top right;
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s linear 0.22s;
  }
  .menu-dropdown.open{
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
    transition: opacity 0.22s ease, transform 0.22s ease, visibility 0s linear 0s;
  }

  /* ---- Smooth swap animation for menu content: whenever the dropdown's
         items are (re)rendered — choosing a playlist, opening the song
         select list, or tapping back — the new items fade/slide in. When
         navigating between two views, JS briefly adds .menu-fade-out to
         fade the old items out just before they're replaced. ---- */
  .menu-dropdown > *{
    animation: menuItemIn 0.22s ease both;
  }
  .menu-dropdown.menu-fade-out > *{
    animation: none;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.13s ease, transform 0.13s ease;
  }
  @keyframes menuItemIn{
    from{ opacity: 0; transform: translateX(8px); }
    to{ opacity: 1; transform: translateX(0); }
  }
  .menu-item{
    display:block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Poppins', sans-serif;
    font-size: 12.5px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .menu-item:hover{ background: rgba(255,255,255,0.08); color: var(--cream); }
  .menu-item.active{
    color: #FFD700;
    font-weight: 600;
    background: rgba(255,215,0,0.1);
  }
  .menu-back{
    color: var(--accent);
    font-weight: 600;
  }
  .menu-header{
    padding: 8px 10px 4px;
    font-size: 10.5px;
    color: var(--faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .menu-loading, .menu-empty{
    padding: 16px 10px;
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  .song-item{
    display: flex;
    flex-direction: column;
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    text-align: left;
    background: transparent;
    border: none;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .song-item:hover{ background: rgba(255,255,255,0.08); }
  .song-item.active{ background: rgba(255,215,0,0.12); }
  .song-item .song-title{
    font-size: 12px;
    font-weight: 600;
    color: var(--cream);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .song-item.active .song-title{ color: #FFD700; }
  .song-item .song-artist{
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }

  /* ---- Search bar inside the three-dot menu (top of playlist list) ---- */
  .menu-search-wrap{
    padding: 6px 6px 8px;
    position: sticky;
    top: 0;
    background: rgba(25,18,10,0.95);
    z-index: 2;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    margin-bottom: 2px;
  }
  .menu-search-input{
    width: 100%;
    box-sizing: border-box;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--cream);
    font-family: 'Poppins', sans-serif;
    font-size: 12.5px;
    padding: 9px 12px 9px 34px;
    outline: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .menu-search-input::placeholder{
    color: var(--muted);
  }
  .menu-search-input:focus{
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,215,0,0.45);
  }
  .menu-search-icon{
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--muted);
    pointer-events: none;
  }
  .menu-search-wrap{
    position: relative;
  }
  .menu-search-wrap .menu-search-icon{
    left: 18px;
  }

  /* ---- Bottom-center stack: player card + credit block ---- */
  .bottom-stack{
    position: fixed;
    bottom: max(6px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    z-index: 3;
  }

  .player-card{
    position: relative;
    width: min(228px, 76vw);
    overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04) 60%, rgba(255,255,255,0.1));
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 9px 11px 9px;
    backdrop-filter: blur(26px) saturate(160%);
    -webkit-backdrop-filter: blur(26px) saturate(160%);
    box-shadow:
      0 12px 40px -12px rgba(0,0,0,0.55),
      inset 0 1px 1px rgba(255,255,255,0.45),
      inset 0 -1px 1px rgba(0,0,0,0.18);
  }
  .player-card::before{
    content:'';
    position:absolute;
    top:0; left:-60%;
    width:220%; height:100%;
    background: linear-gradient(115deg, transparent 42%, rgba(255,255,255,0.14) 50%, transparent 58%);
    pointer-events:none;
  }
  .player-card::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
    pointer-events:none;
  }

  .player-row{
    display:flex;
    align-items:center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .art{
    width: 37px;
    height: 37px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 1px solid var(--glass-border);
    flex-shrink: 0;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 12px;
    animation: spin 7s linear infinite;
    animation-play-state: paused;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    position: relative;
  }
  .art::after{
    content:'';
    position:absolute;
    top:50%;
    left:50%;
    width: 6px;
    height: 6px;
    background: rgba(0,0,0,0.7);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
    z-index: 2;
    pointer-events: none;
  }
  @keyframes spin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
  .art img{
    width:100%;
    height:100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;
    display:none;
  }
  /* Brief ±5s feedback shown when user double-taps the boy cutout */
  .seek-flash{
    position: fixed;
    top: 42%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    z-index: 4;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .seek-flash.show{
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .meta{
    flex: 1;
    min-width: 0;
  }
  .meta .track-title{
    font-weight: 600;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0 0 2px;
  }
  .meta .track-sub{
    font-size: 9px;
    color: var(--muted);
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .controls{
    display:flex;
    align-items:center;
    gap: 5px;
    flex-shrink: 0;
  }
  .ctrl-btn{
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    color: var(--cream);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .ctrl-btn:hover{ background: rgba(255,255,255,0.18); }
  .ctrl-btn:active{ transform: scale(0.93); }
  .ctrl-btn.play{
    width: 28px;
    height: 28px;
    background: var(--cream);
    color: #241A0E;
  }
  .ctrl-btn.play:hover{ background: #fff; }
  .ctrl-btn svg{ width: 9px; height: 9px; }
  .ctrl-btn.play svg{ width: 11px; height: 11px; }

  .progress-row{
    display:flex;
    align-items:center;
    gap: 7px;
    margin-top: 7px;
    font-size: 7.5px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    position: relative;
    z-index: 1;
  }
  .progress-track{
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.18);
    overflow: hidden;
    position: relative;
  }
  .progress-fill{
    height: 100%;
    width: 0%;
    background: var(--cream);
    border-radius: 2px;
    transition: width 0.3s linear;
  }

  .player-frame{
    width: 1px;
    height: 1px;
    overflow: hidden;
    position: absolute;
    left: -9999px;
  }

  /* ---- Sliding yellow hint text, between player card and credit block ---- */
  .hint-marquee{
    width: min(228px, 76vw);
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
  }
  .hint-marquee-track{
    display: inline-flex;
    width: max-content;
    gap: 46px;
    animation: hint-marquee-scroll 10s linear infinite;
  }
  .hint-marquee-text{
    display: inline-block;
    white-space: nowrap;
    color: #FFD54A;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-shadow: 0 0 10px rgba(255,213,74,0.45), 0 2px 5px rgba(0,0,0,0.6);
  }
  @keyframes hint-marquee-scroll{
    from{ transform: translateX(0); }
    to{ transform: translateX(calc(-50% - 23px)); }
  }

  /* ---- Credit + Instagram link, below player card ---- */
  .credit-block{
    text-align: center;
  }
  .made-with{
    font-size: 9px;
    color: var(--muted);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    margin: 0 0 4px;
  }
  .insta-link{
    display:inline-flex;
    align-items:center;
    gap: 4px;
    text-decoration: none;
    color: var(--cream);
    font-size: 10px;
    font-weight: 500;
    background: rgba(255,255,255,0.1);
    border: 1px solid var(--glass-border);
    padding: 4px 10px;
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.15s;
  }
  .insta-link:hover{ background: rgba(255,255,255,0.18); }
  .insta-link svg{ width: 11px; height: 11px; flex-shrink: 0; }

  @media (max-width: 420px){
    .center-name{ font-size: 7vw; }
    .top-left-time{ font-size: 10px; }
    .live-badge{ font-size: 10px; }
    .caption-strip{ font-size: 11px; }
  }

  /* ---- Landscape phones (short viewport height): shrink + tighten the bottom stack so
         name, caption, player card and credit block all fit without overlapping the
         top bar (time / online / menu). Background stays exactly the same. ---- */
  @media (orientation: landscape) and (max-height: 500px){
    .bottom-stack{ gap: 6px; bottom: max(8px, env(safe-area-inset-bottom)); }
    .center-name{ font-size: clamp(13px, 3vw, 19px); }
    .caption-strip{ font-size: 10.5px; line-height: 1.25; width: min(230px, 60vw); }
    .player-card{ width: min(220px, 55vw); padding: 8px 10px 8px; border-radius: 16px; }
    .player-row{ gap: 8px; }
    .art{ width: 32px; height: 32px; font-size: 12px; }
    .art::after{ width: 4px; height: 4px; }
    .meta .track-title{ font-size: 10.5px; }
    .meta .track-sub{ font-size: 9px; }
    .controls{ gap: 4px; }
    .ctrl-btn{ width: 23px; height: 23px; }
    .ctrl-btn.play{ width: 27px; height: 27px; }
    .ctrl-btn svg{ width: 9px; height: 9px; }
    .ctrl-btn.play svg{ width: 10px; height: 10px; }
    .progress-row{ margin-top: 6px; font-size: 8px; gap: 6px; }
    .credit-block .made-with{ font-size: 9px; margin-bottom: 4px; }
    .insta-link{ font-size: 10px; padding: 4px 10px; gap: 4px; }
    .insta-link svg{ width: 11px; height: 11px; }
    .top-left-time, .live-badge{ font-size: 9.5px; }
    .menu-btn{ width: 26px; height: 26px; }
    .menu-btn svg{ width: 13px; height: 13px; }
  }

  /* ---- Desktop / large screens: scale everything up a bit so the bottom cluster
         doesn't look like a tiny floating widget on a big background image. ---- */
  @media (min-width: 700px) and (min-height: 600px){
    .bottom-stack{ gap: 16px; bottom: max(28px, env(safe-area-inset-bottom)); }
    .center-name{ font-size: clamp(28px, 2.6vw, 44px); }
    .caption-strip{ font-size: 14px; width: min(340px, 90vw); }
    .player-card{ width: min(340px, 90vw); padding: 16px 20px 16px; border-radius: 26px; }
    .player-row{ gap: 12px; }
    .art{ width: 58px; height: 58px; font-size: 19px; }
    .art::after{ width: 7px; height: 7px; }
    .meta .track-title{ font-size: 16px; }
    .meta .track-sub{ font-size: 12.5px; }
    .controls{ gap: 8px; }
    .ctrl-btn{ width: 38px; height: 38px; }
    .ctrl-btn.play{ width: 44px; height: 44px; }
    .ctrl-btn svg{ width: 14px; height: 14px; }
    .ctrl-btn.play svg{ width: 16px; height: 16px; }
    .progress-row{ margin-top: 12px; font-size: 11px; }
    .credit-block .made-with{ font-size: 13px; }
    .insta-link{ font-size: 13px; padding: 8px 16px; }
    .insta-link svg{ width: 15px; height: 15px; }
    .top-left-time, .live-badge{ font-size: 13px; }
    .menu-btn{ width: 36px; height: 36px; }

  <!-- Off-screen, muted helper player: used ONLY to read a playlist's video
       list while the user is browsing the menu. It never plays audibly and
       never touches ytPlayer, so whatever song is currently playing keeps
       playing untouched until the user actually picks something. -->
  <div class="player-frame"><div id="ytTempPlayer"></div></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  /* ---- Resume-from-last-song: whatever song/playlist/position the user
         was on last time gets remembered in localStorage, so next time
         they open the site/app it's cued at the SAME spot — it only
         actually starts playing once they tap the play button. A
         first-time visitor (no saved state yet) gets the Bengali Romantic
         playlist cued by default instead. ---- */
  const RESUME_KEY = 'musicfy_resume_v1';
  const DEFAULT_PLAYLIST_ID = 'PL5BRv17qD4RUPGa_SBbUC_BT5Zry32zM2'; // Bengali Romantic
  function loadResumeState(){
    try{
      const raw = localStorage.getItem(RESUME_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.playlistId) return null;
      return parsed;
    } catch(err){ return null; }
  }
  const resumeState = loadResumeState();
  let currentPlaylistId = resumeState ? resumeState.playlistId : DEFAULT_PLAYLIST_ID;

  const playBtn = document.getElementById('playBtn');
  const playIconPath = document.getElementById('playIconPath');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const trackTitle = document.getElementById('trackTitle');
  const trackSub = document.getElementById('trackSub');
  const art = document.getElementById('art');
  const artImg = document.getElementById('artImg');
  const artEmoji = document.getElementById('artEmoji');
  const curTime = document.getElementById('curTime');
  const durTime = document.getElementById('durTime');
  const butterflyOverlay = document.getElementById('butterflyOverlay');

  function showButterflies(){
    butterflyOverlay.classList.add('show');
    const p = butterflyOverlay.play();
    if (p && p.catch) p.catch(() => {});
  }
  function hideButterflies(){
    butterflyOverlay.classList.remove('show');
    butterflyOverlay.pause();
  }
  const progressFill = document.getElementById('progressFill');
  const istTimeEl = document.getElementById('istTime');
  const onlineCountEl = document.getElementById('onlineCount');
  const captionStrip = document.getElementById('captionStrip');

  let ytPlayer = null;
  let ytReady = false;
  let progressInterval = null;
  let ytTempPlayer = null; // off-screen helper player, only used to read playlist contents

  const ICON_PLAY = 'M8 5v14l11-7z';
  const ICON_PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';

  function setPlayingIcon(isPlaying){
    playIconPath.setAttribute('d', isPlaying ? ICON_PAUSE : ICON_PLAY);
    playBtn.setAttribute('aria-label', isPlaying ? 'Pause' : 'Play');
  }

  function fmtTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function updateProgress(){
    if (!ytPlayer || !ytPlayer.getCurrentTime) return;
    const cur = ytPlayer.getCurrentTime() || 0;
    const dur = ytPlayer.getDuration() || 0;
    curTime.textContent = fmtTime(cur);
    durTime.textContent = fmtTime(dur);
    progressFill.style.width = dur ? `${(cur/dur)*100}%` : '0%';
    saveResumeState();
  }

  /* ---- Remember exactly which playlist, which song (by its position in
     the playlist) and what timestamp the user was last on, so it can be
     restored next visit. Only called while a song has actually been
     played (see progressInterval), matching "last song jo play kiya
     tha" — just opening the menu/browsing never touches this. ---- */
  function saveResumeState(){
    if (!ytPlayer || !ytReady || !currentPlaylistId) return;
    // Don't persist YouTube-search sessions (they are temporary)
    if (isSearchMode || String(currentPlaylistId).startsWith('search:')) return;
    if (!ytPlayer.getCurrentTime || !ytPlayer.getPlaylistIndex) return;
    try{
      const idx = ytPlayer.getPlaylistIndex();
      const time = ytPlayer.getCurrentTime() || 0;
      localStorage.setItem(RESUME_KEY, JSON.stringify({
        playlistId: currentPlaylistId,
        index: idx >= 0 ? idx : 0,
        time: time
      }));
    } catch(err){}
  }

  function parseTitleArtist(rawTitle, author){
    if (!rawTitle) return { title: 'Unknown', artist: author || '' };
    // Strip common noise tags like (Official Video), [Lyrics], etc.
    let cleaned = rawTitle.replace(/[\(\[][^)\]]*(official|lyric|audio|video|full song|hd|4k)[^)\]]*[\)\]]/gi, '').trim();
    // Try common "Title - Artist" or "Artist - Title" separators
    const seps = [' - ', ' – ', ' — ', ' | ', ' • '];
    for (const sep of seps){
      if (cleaned.includes(sep)){
        const parts = cleaned.split(sep).map(s => s.trim()).filter(Boolean);
        if (parts.length >= 2){
          return { title: parts[0], artist: parts.slice(1).join(', ') };
        }
      }
    }
    // No separator found — fall back to full title + channel name as artist
    return { title: cleaned || rawTitle, artist: author || '' };
  }

  function updateMeta(data){
    if (!data || !data.title) return; // ignore empty/not-yet-loaded data
    const parsed = parseTitleArtist(data.title, data.author);
    trackTitle.textContent = parsed.title;
    trackSub.textContent = parsed.artist || data.author || '';
    if (data.video_id){
      artImg.src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
      artImg.style.display = 'block';
      if (artEmoji) artEmoji.style.display = 'none';
    }
    updateMediaSessionMeta(parsed, data.video_id);
  }

  /* ---- Lock screen / notification media controls (Media Session API) ----
     Shows the current song's title, artist and artwork on the phone's lock
     screen / notification shade, with working play/pause/prev/next — this
     is also the thing that tells Android "this is real media playback",
     which is what lets it keep going after the screen locks. Setup runs
     once; only the metadata + play state get refreshed per track. */
  function updateMediaSessionMeta(parsed, videoId){
    if (!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.metadata = new MediaMetadata({
        title: parsed.title || 'Musicfy',
        artist: parsed.artist || '',
        album: 'Musicfy',
        artwork: videoId ? [
          { src: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' },
          { src: `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`, sizes: '1280x720', type: 'image/jpeg' }
        ] : []
      });
    } catch(err){}
  }
  function setupMediaSessionHandlers(){
    if (!('mediaSession' in navigator)) return;
    try{
      navigator.mediaSession.setActionHandler('play', () => {
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => {
        if (isSearchMode) playPreviousRelatedSong();
        else if (ytPlayer && ytPlayer.previousVideo) ytPlayer.previousVideo();
      });
      navigator.mediaSession.setActionHandler('nexttrack', () => {
        if (isSearchMode) playRelatedSong();
        else if (ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo();
      });
    } catch(err){}
  }
  setupMediaSessionHandlers();

  function resetDisplay(){
    trackTitle.textContent = '𝐏𝖑𝖆𝐲𝖑𝖎𝖘𝖙 𝐚𝖗𝖊 𝐥𝖔𝖆𝖉𝖎𝖓𝖌 𝐬𝖔 𝐰𝖆𝖎𝖙 2-3 𝐬𝖊𝖈..';
    trackSub.textContent = '';
    curTime.textContent = '0:00';
    durTime.textContent = '0:00';
    progressFill.style.width = '0%';
    artImg.style.display = 'none';
    artImg.removeAttribute('src');
    if (artEmoji) artEmoji.style.display = '';
    setPlayingIcon(false);
    setSpinning(false);
  }

  function setSpinning(isSpinning){
    art.style.animationPlayState = isSpinning ? 'running' : 'paused';
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveResumeState();
  });
  window.addEventListener('pagehide', saveResumeState);

  /* ---- Live IST clock (top-left) ---- */
  function updateISTTime(){
    const now = new Date();
    const formatted = new Intl.DateTimeFormat('en-IN', {
      timeZone: 'Asia/Kolkata',
      day: '2-digit',
      month: 'short',
      hour: '2-digit',
      minute: '2-digit',
      hour12: true
    }).format(now);
    istTimeEl.textContent = formatted;
  }
  updateISTTime();
  setInterval(updateISTTime, 15000);

  /* ---- Simulated live online-user count (top-center) ---- */
  let onlineBase = Math.floor(Math.random() * 30) + 15; // 15-44
  function tickOnline(){
    onlineBase += Math.floor(Math.random() * 3) - 1; // -1, 0, or +1
    if (onlineBase < 3) onlineBase = 3;
    onlineCountEl.textContent = `${onlineBase} online`;
  }
  tickOnline();
  setInterval(tickOnline, 5000);

  /* ---- Rotating captions ---- */
  const captions = [
    "Apna time aayega, \ntab tak play next karo ;)",
    "Dil se jio, duniya ki chhodo :}",
    "Life is short, chai has to be strong!",
    "Sab kuch theek hoga, \nfilhaal picture meri perfect hai >.<",
    "Apni marzi ka jeevan, \nno explanations needed ^_^",
    "Not everyone gets me, \nand that is completely fine :-!",
    "Apni league mein akela hoon :)",
    "Zero drama, sirf real energy!",
    "Diet kal se aaj ke liye, \npizza book kar do >.<",
    "Gym jaana tha, biryani kha li, \nsame energy hai ;)",
    "Bank balance kam, confidence full!",
    "Koi interested ladki hi,\nmujhe DM kare, (for pyaar) ^_^",
    "Dil diya toh,\ndeal pakki hai madam ji ;)"
  ];
  let captionIndex = 0;
  function showCaption(idx){
    captionStrip.classList.remove('show');
    setTimeout(() => {
      captionStrip.textContent = captions[idx];
      captionStrip.classList.add('show');
    }, 400);
  }
  showCaption(captionIndex);
  setInterval(() => {
    captionIndex = (captionIndex + 1) % captions.length;
    showCaption(captionIndex);
  }, 7000);

  /* ---- YouTube player ----
     Supports both normal playlists (listId starts with PL...) and
     YouTube search results (listType: 'search', list = search query).
     When a search-result song ends, the player auto-advances to the
     next related video from the same search list. */
  let isSearchMode = false;
  let currentSearchQuery = '';

  function createPlayer(listId, autoplay, onReadyExtra, startIndex, asSearch){
    isSearchMode = !!asSearch;
    if (asSearch) currentSearchQuery = listId;

    const playerVars = asSearch
      ? { listType: 'search', list: listId, index: (typeof startIndex === 'number' ? startIndex : 0), autoplay: autoplay ? 1 : 0, playsinline: 1, fs: 0 }
      : { listType: 'playlist', list: listId, index: (typeof startIndex === 'number' ? startIndex : 0), autoplay: autoplay ? 1 : 0, playsinline: 1, fs: 0 };

    ytPlayer = new YT.Player('ytPlayer', {
      height: '100%',
      width: '100%',
      playerVars: playerVars,
      events: {
        onReady: (e) => {
          ytReady = true;
          const data = e.target.getVideoData ? e.target.getVideoData() : null;
          updateMeta(data);
          if (!autoplay){
            // Safety net: some browsers/webviews start playback on cue
            // even with autoplay:0 — force it back to paused.
            try { e.target.pauseVideo(); } catch(err){}
          }
          if (onReadyExtra) onReadyExtra(e.target);
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING){
            setPlayingIcon(true);
            updateMeta(ytPlayer.getVideoData());
            setSpinning(true);
            showButterflies();
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            if (!progressInterval) progressInterval = setInterval(updateProgress, 500);
          } else if (e.data === YT.PlayerState.PAUSED){
            setPlayingIcon(false);
            setSpinning(false);
            hideButterflies();
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
            saveResumeState();
          } else if (e.data === YT.PlayerState.ENDED){
            // Search-mode and normal playlists both auto-advance to the
            // next video in the list. UI is only fully reset if needed.
            setPlayingIcon(false);
            setSpinning(false);
            hideButterflies();
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
          } else if (e.data === YT.PlayerState.CUED){
            updateMeta(ytPlayer.getVideoData());
          }
        },
        onError: () => {
          trackTitle.textContent = '𝐓𝖍𝖎𝖘 𝐩𝖑𝖆𝐲𝖑𝖎𝖘𝖙 𝐜𝖆𝖓 𝐧𝖔𝖙 𝐥𝖔𝖆𝖉𝖎𝖓𝖌 𝐫𝖎𝖌𝖍𝖙 𝐧𝖔𝖜!';
          trackSub.textContent = '';
          hideButterflies();
        }
      }
    });
  }

  function onYouTubeIframeAPIReady(){
    // Don't try to resume a previous YouTube-search session (search:...) —
    // fall back to the default playlist instead.
    if (currentPlaylistId && !String(currentPlaylistId).startsWith('search:')){
      const startIndex = (resumeState && typeof resumeState.index === 'number') ? resumeState.index : 0;
      createPlayer(currentPlaylistId, false, (player) => {
        if (!resumeState) return;
        // Cued at the right track already (via playerVars.index above); now
        // seek to the exact saved timestamp too, then make sure it's paused
        // — it only actually starts playing once the user taps play.
        if (resumeState.time){
          setTimeout(() => {
            try{
              player.seekTo(resumeState.time, true);
              player.pauseVideo();
            } catch(err){}
          }, 300);
        }
      }, startIndex);
    } else {
      // First visit or last session was a search → show default playlist
      currentPlaylistId = DEFAULT_PLAYLIST_ID;
      createPlayer(DEFAULT_PLAYLIST_ID, false);
    }
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  /* No hardcoded default playlist anymore — a first-time visitor (nothing
     saved yet) sees this prompt instead of a playlist auto-loading. */
  function showNoPlaylistPrompt(){
    trackTitle.textContent = '𝐌𝐞𝐧𝐮 𝐬𝐞 𝐚𝐩𝐧𝐢 𝐩𝐥𝐚𝐲𝐥𝐢𝐬𝐭 𝐜𝐡𝐮𝐧𝐞𝐢𝐧';
    trackSub.textContent = 'Top-right ⋮ par tap karo';
    setPlayingIcon(false);
  }

  playBtn.addEventListener('click', () => {
    if (!ytPlayer){
      // No playlist picked yet — nudge the user to the menu instead of doing nothing.
      menuDropdown.classList.add('open');
      renderFolderList();
      return;
    }
    if (!ytReady || !ytPlayer.getPlayerState) return;
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING){
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });

  prevBtn.addEventListener('click', () => {
    if (isSearchMode){
      playPreviousRelatedSong();
      return;
    }
    if (ytPlayer && ytPlayer.previousVideo) ytPlayer.previousVideo();
  });
  nextBtn.addEventListener('click', () => {
    if (isSearchMode){
      playRelatedSong();
      return;
    }
    if (ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo();
  });

  /* ---- Double-tap on MAIN BOY cutout: left half = -5s, right half = +5s
     Works in every mode (playlist / select-a-song / YouTube search).
     Player card, menu and top bar sit above the boy (higher z-index) so
     their buttons still work normally. ---- */
  const boyCutout = document.getElementById('boyCutout');
  const seekFlash = document.getElementById('seekFlash');
  let lastBoyTapTime = 0;
  let lastBoyTapX = 0;
  function seekBySeconds(delta){
    if (!ytPlayer || !ytReady || !ytPlayer.getCurrentTime || !ytPlayer.seekTo) return;
    try{
      const cur = ytPlayer.getCurrentTime() || 0;
      const dur = ytPlayer.getDuration() || 0;
      let next = cur + delta;
      if (next < 0) next = 0;
      if (dur > 0 && next > dur) next = dur;
      ytPlayer.seekTo(next, true);
      if (seekFlash){
        seekFlash.textContent = delta > 0 ? '+5s' : '−5s';
        seekFlash.classList.add('show');
        clearTimeout(seekFlash._hideTimer);
        seekFlash._hideTimer = setTimeout(() => seekFlash.classList.remove('show'), 550);
      }

  /* ---- YouTube search via public Invidious / Piped instances
     (listType:'search' was deprecated by YouTube in Nov 2020).
     Tries multiple mirrors so one down instance doesn't break search. ---- */
  const SEARCH_APIS = [
    // Piped first (reliable CORS, no captcha)
    (q) => `https://api.piped.private.coffee/search?q=${encodeURIComponent(q)}&filter=videos`,
    (q) => `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(q)}&filter=videos`,
    (q) => `https://pipedapi.adminforge.de/search?q=${encodeURIComponent(q)}&filter=videos`,
    (q) => `https://pipedapi.syncpundit.io/search?q=${encodeURIComponent(q)}&filter=videos`,
    // Invidious fallbacks
    (q) => `https://inv.nadeko.net/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
    (q) => `https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
    (q) => `https://yewtu.be/api/v1/search?q=${encodeURIComponent(q)}&type=video`
  ];

  let searchVideoQueue = [];   // original search results (kept for reference)
  let searchQueueIndex = 0;
  // Related-song chain (YouTube-style): history of played videos so Prev works
  let relatedHistory = [];    // [{id, title, artist}, ...]
  let relatedHistoryIndex = -1;
  let currentVideoId = null;

  function normalizeSearchResults(raw, source){
    // Piped returns { items: [...] }; Invidious returns a plain array
    let items = [];
    if (Array.isArray(raw)){
      items = raw;
    } else if (raw && Array.isArray(raw.items)){
      items = raw.items;
    } else {
      return [];
    }

    // Invidious video objects have videoId
    if (source === 'invidious' || (items[0] && items[0].videoId)){
      return items
        .filter(item => item && item.videoId && (item.type === 'video' || !item.type))
        .map(item => ({
          id: item.videoId,
          title: item.title || 'Unknown',
          artist: item.author || item.authorId || ''
        }))
        .filter(s => s.id && s.id.length >= 10);
    }

    // Piped stream objects have url like /watch?v=VIDEO_ID
    return items
      .filter(item => item && (item.url || item.id) && item.type !== 'channel' && item.type !== 'playlist')
      .map(item => {
        let id = item.id || '';
        if (!id && item.url){
          const m = String(item.url).match(/(?:[?&]v=|\/watch\/|\/shorts\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
          if (m) id = m[1];
          else {
            // Piped often returns "/watch?v=XXXXXXXXXXX"
            const m2 = String(item.url).match(/([a-zA-Z0-9_-]{11})\s*$/);
            if (m2) id = m2[1];
            const m3 = String(item.url).match(/v=([a-zA-Z0-9_-]{11})/);
            if (m3) id = m3[1];
          }
        }
        return {
          id,
          title: item.title || 'Unknown',
          artist: item.uploaderName || item.uploader || item.author || ''
        };
      })
      .filter(s => s.id && s.id.length === 11);
  }

  function fetchSearchVideoIds(query, callback){
    let tried = 0;
    function tryNext(){
      if (tried >= SEARCH_APIS.length){
        callback([]);
        return;
      }
      const urlBuilder = SEARCH_APIS[tried++];
      const url = urlBuilder(query);
      // Piped responses are {items:[...]}, Invidious is a plain array
      const isPiped = url.includes('piped') || url.includes('pipedapi');
      fetch(url, { method: 'GET', mode: 'cors' })
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(data => {
          const songs = normalizeSearchResults(data, isPiped ? 'piped' : 'invidious');
          if (songs.length){
            callback(songs);
          } else {
            tryNext();
          }
        })
        .catch(() => tryNext());
    }
    tryNext();
  }

  /* Play a song from YouTube search results.
     On Next / song-end → fetch REAL related videos of the current song
     (YouTube-style), not the next item from the search list. */
  function playSearchSongAtIndex(query, index, songs){
    activePlaylistId = null;
    currentPlaylistId = 'search:' + query;
    isSearchMode = true;
    currentSearchQuery = query;
    searchVideoQueue = Array.isArray(songs) ? songs.slice() : [];
    searchQueueIndex = (typeof index === 'number' && index >= 0) ? index : 0;

    const startSong = searchVideoQueue[searchQueueIndex];
    if (!startSong || !startSong.id){
      trackTitle.textContent = '𝐒𝖔𝖓𝖌 𝐥𝖔𝖆𝖉 𝐧𝖆𝖍𝖎 𝐡𝖔 𝐩𝖆𝖞𝖆';
      return;
    }

    // Reset related history with this song as the root
    relatedHistory = [{ id: startSong.id, title: startSong.title, artist: startSong.artist }];
    relatedHistoryIndex = 0;
    currentVideoId = startSong.id;
    relatedCache = {};
    relatedPrefetching = {};
    relatedFetchBusy = false;

    loadSingleVideo(startSong, { forceNew: true });
  }

  /* Cache of related songs per videoId — prefetched while current song plays
     so Next feels instant (no waiting for API on tap). */
  let relatedCache = {};          // { videoId: [{id,title,artist}, ...] }
  let relatedPrefetching = {};    // { videoId: true } — avoid duplicate fetches
  let relatedFetchBusy = false;

  function loadSingleVideo(song, opts){
    if (!song || !song.id) return;
    const forceNew = opts && opts.forceNew;
    currentVideoId = song.id;
    updateMeta({ title: song.title, author: song.artist, video_id: song.id });

    // FAST PATH: player already exists → just swap the video (instant)
    if (!forceNew && ytPlayer && ytReady && ytPlayer.loadVideoById){
      try {
        ytPlayer.loadVideoById(song.id);
        // Prefetch related for this new song in the background
        prefetchRelated(song.id, song.title);
        return;
      } catch(err){
        // fall through to full recreate
      }
    }

    // SLOW PATH: first search song (or player missing) — create player once
    resetDisplay();
    hideButterflies();
    ytReady = false;

      width: '100%',
      videoId: song.id,

        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING){
            setPlayingIcon(true);
            const data = ytPlayer.getVideoData ? ytPlayer.getVideoData() : null;
            if (data && data.title) updateMeta(data);
            else updateMeta({ title: song.title, author: song.artist, video_id: song.id });

            setSpinning(true);
            showButterflies();
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            if (!progressInterval) progressInterval = setInterval(updateProgress, 500);
            // Keep related cache warm
            prefetchRelated(currentVideoId || song.id, (data && data.title) || song.title);
          } else if (e.data === YT.PlayerState.PAUSED){
            setPlayingIcon(false);
            setSpinning(false);
            hideButterflies();
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
          } else if (e.data === YT.PlayerState.ENDED){

          }

        onError: () => {
          if (isSearchMode) playRelatedSong();
        }
      }

  /* ---- Related videos via Piped / Invidious + search fallback ---- */
  const RELATED_APIS = [
    (id) => `https://api.piped.private.coffee/streams/${id}`,
    (id) => `https://pipedapi.adminforge.de/streams/${id}`,
    (id) => `https://pipedapi.syncpundit.io/streams/${id}`,
    (id) => `https://pipedapi.kavin.rocks/streams/${id}`,
    (id) => `https://pipedapi.meuz.xyz/streams/${id}`,
    (id) => `https://invidious.nerdvpn.de/api/v1/videos/${id}`,
    (id) => `https://yewtu.be/api/v1/videos/${id}`,
    (id) => `https://inv.nadeko.net/api/v1/videos/${id}`
  ];

  function extractVideoIdFromUrl(url){
    if (!url) return '';
    const s = String(url);
    let m = s.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = s.match(/\/(?:watch\/|shorts\/|embed\/|v\/)([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = s.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    m = s.match(/([a-zA-Z0-9_-]{11})/);
    return m ? m[1] : '';
  }

  function normalizeRelatedResults(raw, videoId){
    let items = [];
    if (!raw || typeof raw !== 'object') return [];

    if (Array.isArray(raw.relatedStreams)){
      items = raw.relatedStreams.map(item => {
        if (!item) return null;
        const id = item.id || item.videoId || extractVideoIdFromUrl(item.url);
        return {
          id: id || '',
          title: item.title || 'Unknown',
          artist: item.uploaderName || item.uploader || item.author || ''
        };
      }).filter(Boolean);
    } else if (Array.isArray(raw.recommendedVideos)){
      items = raw.recommendedVideos.map(item => ({
        id: (item && (item.videoId || item.id)) || '',
        title: (item && item.title) || 'Unknown',
        artist: (item && (item.author || item.authorId)) || ''
      }));
    } else if (Array.isArray(raw.related)){
      items = raw.related.map(item => ({
        id: (item && (item.id || item.videoId || extractVideoIdFromUrl(item.url))) || '',
        title: (item && item.title) || 'Unknown',
        artist: (item && (item.uploaderName || item.uploader || item.author)) || ''
      }));
    }

    return items.filter(s => s.id && s.id.length === 11 && s.id !== videoId);
  }

  function fetchRelatedVideos(videoId, callback){
    if (!videoId){ callback([]); return; }
    let tried = 0;
    function tryNext(){
      if (tried >= RELATED_APIS.length){
        callback([]);
        return;
      }
      const url = RELATED_APIS[tried++](videoId);
      fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store' })
        .then(r => {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(data => {
          const songs = normalizeRelatedResults(data, videoId);
          if (songs.length) callback(songs);
          else tryNext();
        })
        .catch(() => tryNext());
    }
    tryNext();
  }

  function fetchRelatedViaSearch(seedTitle, excludeId, callback){
    const q = (seedTitle || '').trim();
    if (!q || q.length < 2){ callback([]); return; }
    fetchSearchVideoIds(q, (songs) => {
      callback((songs || []).filter(s => s.id && s.id !== excludeId));
    });
  }

  /* Background prefetch — runs while song plays so Next is instant */
  function prefetchRelated(videoId, seedTitle){
    if (!videoId) return;
    if (relatedCache[videoId] && relatedCache[videoId].length) return;
    if (relatedPrefetching[videoId]) return;
    relatedPrefetching[videoId] = true;

    fetchRelatedVideos(videoId, (songs) => {
      if (songs && songs.length){
        relatedCache[videoId] = songs;
        relatedPrefetching[videoId] = false;
        return;
      }
      // Fallback: search by title
      fetchRelatedViaSearch(seedTitle || '', videoId, (fallback) => {
        if (fallback && fallback.length) relatedCache[videoId] = fallback;
        relatedPrefetching[videoId] = false;
      });
    });
  }

  function pickNextRelated(vid){
    const recentIds = new Set(relatedHistory.map(s => s.id));
    if (vid) recentIds.add(vid);
    const pool = (vid && relatedCache[vid]) ? relatedCache[vid] : [];
    return pool.find(s => !recentIds.has(s.id)) || pool[0] || null;
  }

  /* Next / song-end → instant if cache warm, otherwise fetch then play */
  function playRelatedSong(){
    if (!isSearchMode) return;
    if (relatedFetchBusy) return;

    let vid = currentVideoId;
    try {
      if (!vid && ytPlayer && ytPlayer.getVideoData){
        const d = ytPlayer.getVideoData();
        if (d && d.video_id) vid = d.video_id;
      }
    } catch(err){}

    let seedTitle = '';
    if (relatedHistoryIndex >= 0 && relatedHistory[relatedHistoryIndex]){
      seedTitle = relatedHistory[relatedHistoryIndex].title || '';
    }
    if (!seedTitle && trackTitle && trackTitle.textContent){
      seedTitle = trackTitle.textContent;
    }
    if (/related|load|nahi|mil/i.test(seedTitle)) seedTitle = '';

    // INSTANT path: already prefetched
    const cached = pickNextRelated(vid);
    if (cached && cached.id){
      relatedHistory = relatedHistory.slice(0, relatedHistoryIndex + 1);
      relatedHistory.push(cached);
      relatedHistoryIndex = relatedHistory.length - 1;
      loadSingleVideo(cached); // uses loadVideoById — fast
      return;
    }

    // Cache miss — fetch now (still shows brief loading)
    relatedFetchBusy = true;
    trackTitle.textContent = '𝐑𝖊𝖑𝖆𝖙𝖊𝖉 𝐬𝖔𝖓𝖌 𝐥𝖔𝖆𝖉 𝐡𝖔 𝖗𝖆𝖍𝖆 𝐡𝖆𝖎...';
    trackSub.textContent = '';

    function finish(songs){
      relatedFetchBusy = false;
      if (vid && songs && songs.length) relatedCache[vid] = songs;
      const next = pickNextRelated(vid) || (songs && songs[0]);
      if (!next || !next.id){
        trackTitle.textContent = '𝐊𝖔𝖎 𝐫𝖊𝖑𝖆𝖙𝖊𝖉 𝐬𝖔𝖓𝖌 𝐧𝖆𝖍𝖎 𝐦𝖎𝖑𝖆';
        trackSub.textContent = 'Naya search karo ⋮ se';
        setPlayingIcon(false);
        setSpinning(false);
        hideButterflies();
        return;
      }
      relatedHistory = relatedHistory.slice(0, relatedHistoryIndex + 1);
      relatedHistory.push(next);
      relatedHistoryIndex = relatedHistory.length - 1;
      loadSingleVideo(next);
    }

    if (!vid){
      fetchRelatedViaSearch(seedTitle || currentSearchQuery, null, finish);
      return;
    }

    fetchRelatedVideos(vid, (songs) => {
      if (songs && songs.length){ finish(songs); return; }
      fetchRelatedViaSearch(seedTitle || currentSearchQuery, vid, finish);
    });
  }

  /* Prev → instant via history + loadVideoById */
  function playPreviousRelatedSong(){
    if (!isSearchMode) return;
    if (relatedHistoryIndex <= 0) return;
    relatedHistoryIndex--;
    const prev = relatedHistory[relatedHistoryIndex];
    if (prev && prev.id) loadSingleVideo(prev);
  }

  function renderOptions(pl){
    clearMenu();

    const back = document.createElement('button');
    back.className = 'menu-item menu-back';
    back.textContent = '← 𝐁𝖆𝖈𝖐';
    back.addEventListener('click', () => navigateMenu(renderFolderList));
    menuDropdown.appendChild(back);

    const header = document.createElement('div');
    header.className = 'menu-header';
    header.textContent = pl.name;
    menuDropdown.appendChild(header);

    const listenBtn = document.createElement('button');
    listenBtn.className = 'menu-item';
    listenBtn.textContent = '𝐋𝖎𝖘𝖙𝖊𝖓 𝐭𝖍𝖎𝖘 𝐩𝖑𝖆𝐲𝖑𝖎𝖘𝖙';
    listenBtn.addEventListener('click', () => {
      switchToPlaylist(pl.id, false);
      menuDropdown.classList.remove('open');
    });
    menuDropdown.appendChild(listenBtn);

    const selectBtn = document.createElement('button');
    selectBtn.className = 'menu-item';
    selectBtn.textContent = '𝐒𝖊𝖑𝖊𝖈𝖙 𝖆 𝐬𝖔𝖓𝖌 𝐟𝖗𝖔𝖒 𝐭𝖍𝖊 𝐥𝖎𝖘𝖙!';
    selectBtn.addEventListener('click', () => navigateMenu(() => renderSongList(pl)));
    menuDropdown.appendChild(selectBtn);
  }

  function renderSongList(pl){
    clearMenu();

    const back = document.createElement('button');
    back.className = 'menu-item menu-back';
    back.textContent = '← Back';
    back.addEventListener('click', () => navigateMenu(() => renderOptions(pl)));
    menuDropdown.appendChild(back);

    const header = document.createElement('div');
    header.className = 'menu-header';
    header.textContent = pl.name;
    menuDropdown.appendChild(header);

    const loading = document.createElement('div');
    loading.className = 'menu-loading';
    loading.textContent = '𝐒𝖔𝖓𝖌𝖘 𝐚𝖗𝖊 𝐥𝖔𝖆𝖉𝖎𝖓𝖌 𝖘𝖔 𝐛𝖊 𝐩𝖆𝖙𝖎𝖊𝖓𝖙..';
    menuDropdown.appendChild(loading);

    fetchPlaylistVideoIds(pl, (videoIds) => {
      if (!videoIds || !videoIds.length){
        loading.textContent = '𝐂𝖔𝖚𝖑𝖉 𝐧𝖔𝖙 𝐟𝖎𝖓𝖉𝖎𝖓𝖌 𝐭𝖍𝖊 𝐬𝖔𝖓𝖌𝖘!';
        return;
      }
      fetchTitles(videoIds).then(songs => {
        // Only redraw if the user is still looking at this playlist's song list
        if (!menuDropdown.contains(loading)) return;
        loading.remove();
        songs.forEach((song, idx) => {
          const item = document.createElement('button');
          item.className = 'song-item';
          const t = document.createElement('span');
          t.className = 'song-title';
          t.textContent = song.title;
          const a = document.createElement('span');
          a.className = 'song-artist';
          a.textContent = song.artist;
          item.appendChild(t);
          item.appendChild(a);
          item.addEventListener('click', () => {
            playSongAtIndex(pl, idx);
            menuDropdown.classList.remove('open');
          });
          menuDropdown.appendChild(item);
        });
      });
    });
  }

  /* Read a playlist's video IDs WITHOUT disturbing the real player. If the
     real player already happens to be on this exact playlist, its list is
     reused directly. Otherwise a separate, muted, off-screen helper player
     (#ytTempPlayer) is spun up just to read the list — the currently
     playing song (from a different playlist) keeps playing untouched. */
  function fetchPlaylistVideoIds(pl, callback){
    if (ytPlayer && ytReady && currentPlaylistId === pl.id && ytPlayer.getPlaylist){
      const list = ytPlayer.getPlaylist();
      if (list && list.length){ callback(list); return; }
    }
    if (ytTempPlayer && ytTempPlayer.destroy){
      try { ytTempPlayer.destroy(); } catch(err){}
      ytTempPlayer = null;
    }
    ytTempPlayer = new YT.Player('ytTempPlayer', {
      height: '1',
      width: '1',
      playerVars: { listType: 'playlist', list: pl.id, autoplay: 0, mute: 1, playsinline: 1 },
      events: {
        onReady: (e) => {
          try { e.target.mute(); e.target.pauseVideo(); } catch(err){}
          const list = e.target.getPlaylist ? (e.target.getPlaylist() || []) : [];
          callback(list);
        },
        onError: () => callback([])
      }
    });
  }

  function fetchTitles(videoIds){
    return Promise.all(videoIds.map(id =>
      fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent('https://www.youtube.com/watch?v=' + id)}&format=json`)
        .then(r => r.ok ? r.json() : Promise.reject())
        .then(data => {
          const parsed = parseTitleArtist(data.title, data.author_name);
          return { id, title: parsed.title, artist: parsed.artist };
        })
        .catch(() => ({ id, title: 'Unknown song', artist: '' }))
    ));
  }

  /* This is the ONLY place a song list click can change what's playing —
     browsing the menu never calls this. If the user is already on this
     playlist, just jump to the picked track; otherwise switch the real
     player to this playlist and play that track, right now. */
  function playSongAtIndex(pl, index){
    isSearchMode = false;
    currentSearchQuery = '';
    if (ytPlayer && ytReady && currentPlaylistId === pl.id && ytPlayer.playVideoAt){
      ytPlayer.playVideoAt(index);
      return;
    }
    switchToPlaylist(pl.id, false, (player) => {
      if (player && player.playVideoAt) player.playVideoAt(index);
    });
  }

  /* Switch the player to a different playlist. autoplay=false cues it
     (user taps the home play button); onReadyExtra fires once ready. */
  function switchToPlaylist(listId, autoplay, onReadyExtra){
    isSearchMode = false;
    currentSearchQuery = '';
    activePlaylistId = listId;
    currentPlaylistId = listId;
    resetDisplay();
    hideButterflies();
    ytReady = false;
    if (progressInterval){ clearInterval(progressInterval); progressInterval = null; }
    if (ytPlayer && ytPlayer.destroy){
      try { ytPlayer.destroy(); } catch(err){}
      ytPlayer = null;
    }
    createPlayer(listId, autoplay, onReadyExtra);
  }
</script>
